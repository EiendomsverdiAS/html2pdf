name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Checks & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the Puppeteer postinstall that downloads Chromium,
      # which is unnecessary for syntax checks and unit tests.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check syntax
        run: node --check src/server.js src/generator.js src/telemetry.js src/compressutil.js

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm run test:unit
